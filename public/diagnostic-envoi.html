<!doctype html>
<!-- === AMÉLIORATION AJOUTÉE (autotest d'envoi depuis un appareil) ===
     Page autonome : vérifie, depuis l'appareil qui l'ouvre, que le serveur est
     joignable par l'adresse du site et par l'adresse directe des fonctions.
     Envoie un contenu vide (refusé par le serveur) : aucun dossier créé. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Autotest d'envoi — ACTIVA Whistleblowing</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #eef3fb; color: #0b2545; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.lead { margin: 0 0 18px; color: #3b4f6b; font-size: 14px; }
  .row { display: flex; gap: 12px; align-items: flex-start; background: #fff; border: 1px solid #d6e0ef; border-radius: 14px; padding: 14px; margin-bottom: 10px; }
  .dot { flex: none; width: 12px; height: 12px; border-radius: 50%; margin-top: 6px; background: #94a3b8; }
  .ok .dot { background: #059669; } .ko .dot { background: #e11d48; } .run .dot { background: #f59e0b; }
  .label { font-weight: 700; } .detail { font-size: 13px; color: #475569; word-break: break-word; }
  #verdict { margin-top: 16px; padding: 14px; border-radius: 14px; font-weight: 600; display: none; }
  #verdict.good { display: block; background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46; }
  #verdict.bad { display: block; background: #fff1f2; border: 1px solid #fecdd3; color: #9f1239; }
  .meta { margin-top: 16px; font-size: 12px; color: #64748b; }
  button { margin-top: 14px; width: 100%; padding: 12px; border: 0; border-radius: 12px; background: #0b2545; color: #fff; font-weight: 700; font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Autotest d'envoi</h1>
  <p class="lead">Vérifie que cet appareil peut transmettre un signalement. Aucun signalement n'est créé.</p>
  <div id="checks"></div>
  <div id="verdict" role="status"></div>
  <p class="meta" id="meta"></p>
  <button id="again" type="button">Relancer le test</button>
</main>
<script src="/diagnostic-envoi.js"></script>
</body>
</html>
