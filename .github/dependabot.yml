# === AMÉLIORATION AJOUTÉE (Audit DevOps — P1) ===
# Mises à jour automatiques proposées (pull requests), regroupées et
# hebdomadaires pour limiter le bruit. Les actions GitHub étant épinglées
# par SHA, Dependabot met à jour le SHA ET le commentaire de version.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # === AMÉLIORATION AJOUTÉE === TypeScript 6+ casse la compilation des
    # fonctions (rootDir, moduleResolution « node » supprimé) : pas de montée
    # de version majeure automatique, à faire volontairement avec adaptation
    # de functions/tsconfig.json.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      functions-minor-patch:
        update-types: [minor, patch]
