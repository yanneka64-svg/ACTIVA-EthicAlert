# === AMÉLIORATION AJOUTÉE (Audit DevOps — P0 : barrière qualité) ===
# Vérifie chaque push et chaque pull request, sans rien déployer :
# - application web : compilation TypeScript, tests Vitest, build Vite ;
# - Cloud Functions : compilation (npm run build) et audit des dépendances
#   (échec sur toute vulnérabilité « high » ou « critical »).
# À rendre obligatoire sur `main` : Settings → Branches → règle de
# protection → « Require status checks » → cocher « web » et « functions »
# (voir docs/DEVOPS-RUNBOOK.md).
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4 (v4.4.0)
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2 (v2.2.0)
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run lint
      - name: Unit tests
        run: bun run test
      - name: Build
        run: bun run build

  functions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4 (v4.4.0)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4 (v4.4.0)
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high --omit=dev
