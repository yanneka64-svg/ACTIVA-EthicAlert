# === AMÉLIORATION AJOUTÉE : déploiement continu sur Firebase Hosting ===
# Remplace l'ancien déploiement Netlify : chaque push sur `main` construit
# l'application (Vite → dist/) et la publie sur le canal "live" de Firebase
# Hosting (projet activa-ethicalert-47246). Voir docs/FIREBASE-HOSTING.md.
#
# Secrets GitHub requis (Settings → Secrets and variables → Actions) :
#   FIREBASE_SERVICE_ACCOUNT_ACTIVA  JSON complet d'un compte de service
#                                    (rôle "Firebase Hosting Admin")
#   VITE_FIREBASE_*                  config Web Firebase, injectée au build
# Tant que FIREBASE_SERVICE_ACCOUNT_ACTIVA est absent, le workflow s'arrête
# proprement (aucun échec rouge) au lieu de casser chaque push.
name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ACTIVA != '' }}
    steps:
      - name: Check deployment secret
        if: env.HAS_SA != 'true'
        run: echo "::notice::FIREBASE_SERVICE_ACCOUNT_ACTIVA non configuré — déploiement ignoré (voir docs/FIREBASE-HOSTING.md)."

      - uses: actions/checkout@v4
        if: env.HAS_SA == 'true'

      - uses: oven-sh/setup-bun@v2
        if: env.HAS_SA == 'true'

      - name: Install dependencies
        if: env.HAS_SA == 'true'
        run: bun install --frozen-lockfile

      - name: Build
        if: env.HAS_SA == 'true'
        run: bun run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Deploy to Firebase Hosting (live)
        if: env.HAS_SA == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ACTIVA }}
          projectId: activa-ethicalert-47246
          channelId: live
